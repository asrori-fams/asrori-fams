<script>
'use strict';
/* =========================================================
   Asrori Fam's — Panel Admin (web desktop)
   Memakai ulang seluruh logika aplikasi mobile (Scripts.html):
   data, API, form, laporan, dashboard, pohon. File ini menambah
   tata letak desktop dan tampilan khusus admin.
   ========================================================= */

S.adm = { tables: {}, log: null, logLoading: false, sel: new Set(), q: {} };
S.view = 'ringkasan';

ICON.chart = `<svg viewBox="0 0 48 48"><defs><linearGradient id="ich1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fb2ff"/><stop offset="1" stop-color="#2459d6"/></linearGradient></defs><rect x="4" y="6" width="40" height="36" rx="8" fill="#fff"/><rect x="10" y="24" width="6" height="12" rx="2" fill="url(#ich1)"/><rect x="21" y="16" width="6" height="20" rx="2" fill="#22c55e"/><rect x="32" y="11" width="6" height="25" rx="2" fill="#fbbf24"/><path d="M9 20l10-6 9 4 11-8" fill="none" stroke="#1e3a6e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
ICON.log = `<svg viewBox="0 0 48 48"><rect x="7" y="5" width="34" height="38" rx="7" fill="#fff" stroke="#c7d6ef" stroke-width="1.5"/><g stroke-linecap="round" stroke-width="3"><path d="M15 15h4M15 24h4M15 33h4" stroke="#2f6fed"/><path d="M23 15h11M23 24h11M23 33h7" stroke="#94a3b8"/></g><circle cx="38" cy="38" r="8" fill="#14254a"/><path d="M38 34v4l3 2" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`;
ICON.iuran = `<svg viewBox="0 0 48 48"><defs><linearGradient id="iiu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6ee7a0"/><stop offset="1" stop-color="#16a34a"/></linearGradient></defs><rect x="5" y="8" width="38" height="32" rx="7" fill="#fff" stroke="#c7d6ef" stroke-width="1.5"/><g fill="#dbe7fb"><rect x="10" y="14" width="7" height="7" rx="2"/><rect x="20.5" y="14" width="7" height="7" rx="2"/><rect x="31" y="14" width="7" height="7" rx="2"/><rect x="10" y="26" width="7" height="7" rx="2"/></g><circle cx="35" cy="33" r="9" fill="url(#iiu)"/><path d="M31 33l3 3 5-6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

/* ---------- navigasi ---------- */
const ADM_NAV = [
  ['Utama', [['ringkasan', 'dashboard', 'Ringkasan']]],
  ['Keluarga', [['adm-anggota', 'keluarga', 'Data Anggota'], ['pohon', 'pohon', 'Pohon Keluarga'], ['adm-berita', 'berita', 'Kabar & Moderasi'],
    ['agenda', 'agenda', 'Agenda'], ['galeri', 'galeri', 'Galeri'], ['peta', 'peta', 'Peta Keluarga']]],
  ['Keuangan', [['adm-kas', 'kas', 'Transaksi Kas'], ['@iuran', 'iuran', 'Rekap Iuran'], ['laporan', 'laporan', 'Laporan Keuangan'], ['dashboard', 'chart', 'Dashboard Keuangan']]],
  ['Sistem', [['akun', 'akun', 'Pengaturan'], ['adm-log', 'log', 'Log Aktivitas']]]
];
const ADM_ALIAS = { home: 'ringkasan', anggota: 'adm-anggota', kas: 'adm-kas', berita: 'adm-berita' };

function navActive(key) {
  if (key === '@iuran') return S.view === 'laporan' && S.lap.tab === 'iuran';
  if (key === 'laporan') return S.view === 'laporan' && S.lap.tab !== 'iuran';
  if (key === 'adm-berita') return S.view === 'adm-berita' || S.view === 'berita-feed';
  return S.view === key;
}
function navBadge(key) {
  if (!S.data || S.role !== 'admin') return '';
  if (key === 'adm-berita') { const n = beritaPending(); return n ? `<i class="cnt amber">${n}</i>` : ''; }
  if (key === '@iuran') { const n = iuranStatus(ym(todayStr())).belum.length; return n ? `<i class="cnt">${n}</i>` : ''; }
  if (key === 'agenda') { const n = upcomingAgenda(30).length; return n ? `<i class="cnt blue">${n}</i>` : ''; }
  if (key === 'adm-anggota') return `<i class="cnt blue">${S.data.anggota.length}</i>`;
  return '';
}
function renderSide() {
  const st = (S.data && S.data.settings) || {};
  const logo = st.logo_url ? `<img src="${esc(st.logo_url)}" alt="" referrerpolicy="no-referrer">` : 'A';
  const locked = !S.data || S.role !== 'admin';
  $('#adm-side').innerHTML = `
    <div class="adm-brand"><div class="adm-logo">${logo}</div><div><b>${esc(st.nama_keluarga || "Asrori Fam's")}</b><small>Panel Admin</small></div></div>
    <nav class="adm-nav">${locked ? '' : ADM_NAV.map(([g, items]) => `<div class="adm-grp">${esc(g)}</div>` + items.map(([k, ic, label]) =>
      `<button class="${navActive(k) ? 'active' : ''}" data-action="adm-nav" data-k="${esc(k)}">${ICON[ic] || ''}<span>${esc(label)}</span>${navBadge(k)}</button>`).join('')).join('')}</nav>
    <div class="adm-side-foot">${S.data ? `${esc(S.data.app.name)} v${esc(S.data.app.version)}` : ''}${S.data && S.data.appUrl ? ` · <a href="${esc(S.data.appUrl)}" target="_blank" rel="noopener">Versi mobile</a>` : ''}</div>`;
}
function renderTop() {
  const admin = S.data && S.role === 'admin';
  const notif = admin ? upcomingAgenda(7).length + beritaPending() + beritaBaru() : 0;
  $('#adm-top').innerHTML = `
    <button class="tb adm-menu-btn" data-action="adm-side-open" aria-label="Buka menu">☰</button>
    ${admin ? `<label class="search">${SEARCH_IC}<input id="adm-gq" type="search" placeholder="Cari anggota, berita, transaksi, agenda…" aria-label="Pencarian global"></label>` : '<span class="sp"></span>'}
    <span class="sp"></span>
    ${admin ? `<button class="tb" data-action="notif" aria-label="Pengingat">🔔<span class="lbl">Pengingat</span>${notif ? '<span class="dot"></span>' : ''}</button>
      <button class="tb primary" data-action="quick-add">＋ <span class="lbl">Tambah</span></button>
      <div class="adm-who"><span class="avatar">AD</span><div><b>Admin</b><small>Sesi 6 jam</small></div><button class="tb" data-action="logout" title="Keluar">⎋</button></div>` : ''}`;
  const q = $('#adm-gq');
  if (q) q.addEventListener('keydown', e => { if (e.key === 'Enter' && q.value.trim()) { S.cari.q = q.value.trim(); go('cari'); } });
}

/* ---------- render utama panel ---------- */
function adminRender() {
  if (S.map) { try { S.map.remove(); } catch (e) {} S.map = null; }
  if (ADM_ALIAS[S.view]) S.view = ADM_ALIAS[S.view];
  document.body.dataset.view = S.view;
  document.body.classList.remove('side-open');
  renderSide(); renderTop();
  const v = $('#view');
  if (!S.data) return;
  if (S.role !== 'admin') {
    v.innerHTML = `<div class="gate"><div class="card"><div class="adm-logo">A</div>
      <h2 style="margin:0">Panel Admin</h2><p style="color:var(--muted);font-size:14px;margin:6px 0 0">${esc(S.data.settings.nama_keluarga || "Asrori Fam's")}</p>
      ${S.data.adminReady ? `<form id="login-form" data-role="admin">${pinField()}<button class="btn primary block">Masuk sebagai Admin</button></form>`
        : '<p class="insight" style="margin-top:16px">PIN Admin belum diatur. Buka spreadsheet, menu Asrori Fam\'s &gt; 2. Atur PIN Admin.</p>'}
      ${S.data.appUrl ? `<p style="font-size:12px;margin:14px 0 0"><a href="${esc(S.data.appUrl)}" target="_blank" rel="noopener">Buka aplikasi keluarga (mobile)</a></p>` : ''}</div></div>`;
    const f = $('#login-form'); if (f) { bindLogin(f); setTimeout(() => f.pin.focus(), 50); }
    return;
  }
  const fn = VIEWS[S.view] || VIEWS.ringkasan;
  v.innerHTML = fn();
  if (fn.after) fn.after();
}

function admHead(title, sub, actions) {
  return `<div class="adm-head"><div><h1>${esc(title)}</h1>${sub ? `<p>${sub}</p>` : ''}</div><div class="adm-actions">${actions || ''}</div></div>`;
}

/* ---------- tabel data generik: urut, halaman ---------- */
function dataTable(id, cols, rows, opt = {}) {
  const st = S.adm.tables[id] = S.adm.tables[id] || { sort: opt.sort || null, dir: opt.dir || 1, page: 0, size: opt.size || 25 };
  let r = rows.slice();
  if (st.sort) {
    const c = cols.find(x => x.k === st.sort);
    if (c) {
      const val = c.v || (x => x[c.k]);
      r.sort((a, b) => { const A = val(a), B = val(b);
        return (typeof A === 'number' && typeof B === 'number' ? A - B : String(A == null ? '' : A).localeCompare(String(B == null ? '' : B), 'id', { numeric: true })) * st.dir; });
    }
  }
  const pages = Math.max(1, Math.ceil(r.length / st.size)); if (st.page >= pages) st.page = pages - 1;
  const from = st.page * st.size, slice = r.slice(from, from + st.size);
  const th = cols.map(c => `<th class="${c.num ? 'num' : ''}" ${c.k && c.sort !== false ? `data-action="dt-sort" data-t="${id}" data-k="${c.k}" title="Urutkan"` : ''}>${c.label}${st.sort && st.sort === c.k ? (st.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('');
  const tb = slice.map(x => `<tr>${cols.map(c => `<td class="${c.num ? 'num' : ''} ${c.cls || ''}">${c.r ? c.r(x) : esc(x[c.k])}</td>`).join('')}</tr>`).join('');
  return `<div class="dt-wrap"><table class="dt"><thead><tr>${th}</tr></thead><tbody>${tb || `<tr><td colspan="${cols.length}"><div class="empty"><b>Tidak ada data</b>Ubah pencarian atau filter.</div></td></tr>`}</tbody>${opt.foot || ''}</table></div>
    <div class="pager"><span>${r.length ? `${from + 1}–${Math.min(from + st.size, r.length)} dari ${r.length}` : '0 data'}</span>
      <span style="display:flex;gap:6px;align-items:center"><select class="input" data-dt-size="${id}" style="height:30px;padding:2px 8px;width:auto;font-size:12px" aria-label="Baris per halaman">${[25, 50, 100].map(n => `<option ${n === st.size ? 'selected' : ''}>${n}</option>`).join('')}</select>
      <button class="mini" data-action="dt-page" data-t="${id}" data-d="-1" ${st.page ? '' : 'disabled'}>‹ Sebelumnya</button><button class="mini" data-action="dt-page" data-t="${id}" data-d="1" ${st.page < pages - 1 ? '' : 'disabled'}>Berikutnya ›</button></span></div>`;
}
function bindTableUi() {
  $$('[data-dt-size]').forEach(s => s.onchange = () => { const t = S.adm.tables[s.dataset.dtSize]; t.size = Number(s.value); t.page = 0; render(); });
}
function admSearch(id, placeholder) {
  return `<label class="search">${SEARCH_IC}<input id="${id}" type="search" placeholder="${esc(placeholder)}" value="${esc(S.adm.q[id] || '')}" aria-label="${esc(placeholder)}"></label>`;
}
function bindAdmSearch(id, table) {
  bindSearch('#' + id, v => { S.adm.q[id] = v; if (table && S.adm.tables[table]) S.adm.tables[table].page = 0; });
}
function bindSelect(id, set) { const e = $('#' + id); if (e) e.onchange = () => { set(e.value); render(); }; }
function personCell(id) { const a = index().byId[id]; return a ? `<button class="cell-person" data-action="person" data-id="${esc(a.id)}">${avatar(a)}<b>${esc(a.nama)}</b></button>` : '<span class="muted">–</span>'; }
function nameLink(id) { const a = index().byId[id]; return a ? `<button class="link" style="font-size:13px;text-decoration:none" data-action="person" data-id="${esc(id)}">${esc(a.nama)}</button>` : '<span class="muted">–</span>'; }

/* ===================== RINGKASAN ===================== */
VIEWS.ringkasan = function () {
  const ix = index(), t = todayStr(), p = ym(t), iu = iuranStatus(p), st = S.data.settings;
  const hidup = S.data.anggota.filter(alive).length, maxGen = Math.max.apply(null, [1].concat(Object.values(ix.gen)));
  const masuk = sumKas(k => k.jenis === 'Masuk' && ym(k.tanggal) === p), keluar = sumKas(k => k.jenis === 'Keluar' && ym(k.tanggal) === p);
  const pend = beritaSorted('Menunggu'), ag = upcomingAgenda(30), bd = birthdaysThisMonth();
  const genCount = {}; S.data.anggota.forEach(a => { genCount[ix.gen[a.id]] = (genCount[ix.gen[a.id]] || 0) + 1; });
  const gMax = Math.max.apply(null, [1].concat(Object.values(genCount)));
  const GC = ['#1e3a6e', '#2f6fed', '#0ea5e9', '#14b8a6', '#22c55e', '#f59e0b', '#64748b'];
  const y = Number(t.slice(0, 4)), mIn = Array(12).fill(0), mOut = Array(12).fill(0);
  S.data.kas.filter(k => k.tanggal.slice(0, 4) == y).forEach(k => { (k.jenis === 'Masuk' ? mIn : mOut)[Number(k.tanggal.slice(5, 7)) - 1] += k.jumlah; });
  const logs = S.adm.log;
  return admHead('Halo Admin 👋', `${esc(st.nama_keluarga)} · ${fmtDate(t, true)}`,
    `<button class="btn ghost sm" data-action="reload">⟳ Muat ulang</button>`) + `
  <div class="quick">
    <button data-action="add-anggota">${ICON.keluarga}Tambah anggota</button>
    <button data-action="add-kas-in">${ICON.kas}Catat transaksi</button>
    <button data-action="catat-iuran">${ICON.iuran}Catat iuran</button>
    <button data-action="add-agenda">${ICON.agenda}Buat agenda</button>
    <button data-action="add-berita">${ICON.berita}Tulis kabar</button>
  </div>
  <div class="adm-strip">
    <button class="akpi dark" data-action="adm-nav" data-k="adm-kas">${ICON.kas}<div><small>Saldo kas</small><b>${esc(rp(saldoUntil()))}</b><em>${BULAN[Number(p.slice(5)) - 1]}: +${esc(rpShort(masuk))} / −${esc(rpShort(keluar))}</em></div></button>
    <button class="akpi" data-action="adm-nav" data-k="@iuran">${ICON.iuran}<div><small>Iuran bulan ini</small><b>${iu.pct}%</b><em>${iu.lunas.length} dari ${iu.list.length} lunas</em></div></button>
    <button class="akpi" data-action="adm-nav" data-k="adm-anggota">${ICON.keluarga}<div><small>Anggota</small><b>${S.data.anggota.length}</b><em>${hidup} hidup · ${maxGen} generasi</em></div></button>
    <button class="akpi" data-action="adm-nav" data-k="adm-berita">${ICON.berita}<div><small>Kabar keluarga</small><b>${beritaSorted('Terbit').length}</b><em>${pend.length ? `<span style="color:#b45309">${pend.length} menunggu</span>` : 'tidak ada antrean'}</em></div></button>
    <button class="akpi" data-action="adm-nav" data-k="agenda">${ICON.agenda}<div><small>Agenda 30 hari</small><b>${ag.length}</b><em>${ag[0] ? esc(fmtDate(ag[0].tanggal)) + ' · ' + esc(ag[0].judul) : 'belum ada'}</em></div></button>
  </div>
  <div class="two-col">
    <div style="display:flex;flex-direction:column;gap:16px">
      <section class="adm-card"><h3>Perlu tindakan</h3><p class="sub">Berita menunggu persetujuan dan iuran ${esc(BULAN[Number(p.slice(5)) - 1])} yang belum masuk.</p>
        ${pend.map(b => `<div class="todo"><span class="ic ev" style="width:38px;height:38px;border-radius:12px;display:grid;place-items:center">${bMeta(b.kategori)[0]}</span>
          <span class="tx"><b>${esc(b.judul)}</b><small>${esc(nameOf(b.penulis_id) || 'Anggota')} · ${esc(timeAgo(b.created_at))}</small></span>
          <button class="mini" data-action="berita-detail" data-id="${esc(b.id)}">Baca</button><button class="mini green" data-action="berita-mod" data-v="terbit" data-id="${esc(b.id)}">Terbitkan</button><button class="mini red" data-action="berita-mod" data-v="tolak" data-id="${esc(b.id)}">Tolak</button></div>`).join('')}
        ${iu.belum.slice(0, 8).map(a => `<div class="todo">${avatar(a)}<span class="tx"><b>${esc(a.nama)}</b><small>Belum iuran ${esc(fmtMonth(p))}</small></span><button class="mini blue" data-action="catat-iuran" data-id="${esc(a.id)}">Catat iuran</button></div>`).join('')}
        ${iu.belum.length > 8 ? `<p style="font-size:12px;color:var(--muted);margin:8px 0 0">+${iu.belum.length - 8} anggota lain · <button class="link" data-action="adm-nav" data-k="@iuran">lihat rekap</button></p>` : ''}
        ${!pend.length && !iu.belum.length ? '<div class="empty" style="padding:16px"><b>Semua beres</b>Tidak ada berita yang menunggu dan iuran bulan ini lengkap.</div>' : ''}
      </section>
      <section class="adm-card chart-card"><h3>Arus kas ${y}</h3><p class="sub">Pemasukan vs pengeluaran per bulan</p><div class="chart">${barChart(mIn, mOut)}</div>
        <div class="legend"><span><i style="background:#22c55e"></i>Masuk</span><span><i style="background:#f87171"></i>Keluar</span></div></section>
    </div>
    <div style="display:flex;flex-direction:column;gap:16px">
      <section class="adm-card"><h3>Sebaran generasi</h3><p class="sub">Klik baris untuk melihat anggotanya</p>
        <div class="genbars">${Object.keys(genCount).map(Number).sort((a, b) => a - b).map(g => `<button class="genbar" data-action="adm-gen" data-g="${g}"><span><b style="text-align:left">Gen ${g}</b> <span style="color:var(--muted)">${esc(genLabel(g))}</span></span><span class="track"><i style="width:${Math.round(genCount[g] / gMax * 100)}%;background:${GC[Math.min(g, 7) - 1]}"></i></span><b>${genCount[g]}</b></button>`).join('')}</div></section>
      ${bd.length ? `<section class="adm-card"><h3>Ulang tahun ${BULAN[Number(t.slice(5, 7)) - 1]}</h3><p class="sub">${bd.length} anggota</p>
        ${bd.slice(0, 6).map(a => `<div class="todo">${avatar(a)}<span class="tx"><b>${esc(a.nama)}</b><small>${Number(a.tgl_lahir.slice(8))} ${BULAN[Number(a.tgl_lahir.slice(5, 7)) - 1]} · ${Number(t.slice(0, 4)) - Number(a.tgl_lahir.slice(0, 4))} tahun</small></span>${a.tgl_lahir.slice(5) === t.slice(5) ? '<span class="chip green">Hari ini</span>' : ''}</div>`).join('')}</section>` : ''}
      <section class="adm-card"><h3 style="display:flex;justify-content:space-between">Aktivitas terbaru <button class="link" style="font-size:12px" data-action="adm-nav" data-k="adm-log">Semua log</button></h3><p class="sub">Perubahan data dari aplikasi</p>
        ${logs === null ? '<div class="skeleton" style="height:120px"></div>' : (logs.slice(0, 8).map(l => `<div class="todo"><span class="chip ${logChip(l.aksi)}">${esc(l.aksi)}</span><span class="tx"><b>${esc(l.entitas)}${l.ringkasan ? ' · ' + esc(l.ringkasan) : ''}</b><small>${esc(timeAgo(l.waktu))} · ${esc(l.peran)}</small></span></div>`).join('') || '<p style="color:var(--muted);font-size:13px">Belum ada aktivitas.</p>')}
      </section>
    </div>
  </div>`;
};
VIEWS.ringkasan.after = () => { if (S.adm.log === null) loadLog(); };
function logChip(a) { a = String(a); return /DELETE|TOLAK/.test(a) ? 'red' : /CREATE|TERBIT|LOGIN/.test(a) ? 'green' : /UPDATE|SEMAT|LEPAS/.test(a) ? 'amber' : 'gray'; }
async function loadLog() {
  if (S.adm.logLoading) return; S.adm.logLoading = true;
  try { S.adm.log = await api('apiGetLog', S.token, 500); } catch (e) { S.adm.log = []; toast(e.message, 'error'); handleAuthErr(e); }
  S.adm.logLoading = false;
  if (S.view === 'ringkasan' || S.view === 'adm-log') render();
}

/* ===================== DATA ANGGOTA (tabel) ===================== */
S.adm.agen = ''; S.adm.astat = '';
VIEWS['adm-anggota'] = function () {
  const ix = index(), q = (S.adm.q['aq'] || '').toLowerCase();
  let rows = S.data.anggota.filter(a => !q || [a.nama, a.panggilan, a.pekerjaan, a.alamat, a.no_hp, a.tempat_lahir].join(' ').toLowerCase().includes(q));
  if (S.adm.agen) rows = rows.filter(a => ix.gen[a.id] === Number(S.adm.agen));
  const sf = S.adm.astat;
  if (sf === 'hidup') rows = rows.filter(alive); if (sf === 'wafat') rows = rows.filter(a => !alive(a));
  if (sf === 'iuran') rows = rows.filter(wajib); if (sf === 'L' || sf === 'P') rows = rows.filter(a => a.jenis_kelamin === sf);
  if (sf === 'lengkapi') rows = rows.filter(a => !a.tgl_lahir || (ix.gen[a.id] > 1 && !a.ayah_id && !a.ibu_id && !spouseIds(a).length));
  const maxG = Math.max.apply(null, [MAX_GEN].concat(Object.values(ix.gen)));
  const cols = [
    { k: 'nama', label: 'Nama', r: a => personCell(a.id) },
    { k: 'jenis_kelamin', label: 'JK', r: a => a.jenis_kelamin === 'P' ? 'P' : 'L' },
    { k: 'gen', label: 'Generasi', v: a => ix.gen[a.id], r: a => `<span class="chip gen-${Math.min(ix.gen[a.id], 7)}">Gen ${ix.gen[a.id]}</span> <span class="muted">${esc(genLabel(ix.gen[a.id]))}</span>` },
    { k: 'ortu', label: 'Orang tua', v: a => nameOf(a.ayah_id) + nameOf(a.ibu_id), r: a => [a.ayah_id, a.ibu_id].filter(Boolean).map(nameLink).join(' & ') || '<span class="muted">–</span>' },
    { k: 'pasangan', label: 'Pasangan', sort: false, r: a => spouseIds(a).map(nameLink).join(', ') || '<span class="muted">–</span>' },
    { k: 'tgl_lahir', label: 'Lahir', r: a => a.tgl_lahir ? `${fmtDate(a.tgl_lahir)} <span class="muted">${age(a) !== '' ? '(' + age(a) + ')' : ''}</span>` : '<span class="muted">–</span>' },
    { k: 'no_hp', label: 'WhatsApp', r: a => a.no_hp ? `<a href="https://wa.me/${esc(a.no_hp.replace(/^0/, '62').replace(/\D/g, ''))}" target="_blank" rel="noopener">${esc(a.no_hp)}</a>` : '<span class="muted">–</span>' },
    { k: 'wajib_iuran', label: 'Iuran', v: a => wajib(a) ? 1 : 0, r: a => wajib(a) ? '<span class="chip green">Wajib</span>' : '<span class="muted">–</span>' },
    { k: 'status', label: 'Status', v: a => alive(a) ? 0 : 1, r: a => alive(a) ? '<span class="chip green">Hidup</span>' : '<span class="chip gray">Alm.</span>' },
    { label: '', r: a => `<div class="row-actions"><button class="mini" data-action="edit-anggota" data-id="${esc(a.id)}">Edit</button>${ix.gen[a.id] < MAX_GEN ? `<button class="mini" data-action="add-child" data-id="${esc(a.id)}">+ Anak</button>` : ''}<button class="mini" data-action="tree-focus" data-id="${esc(a.id)}" title="Lihat di pohon">🌳</button></div>` }
  ];
  if (!S.adm.tables['t-anggota']) S.adm.tables['t-anggota'] = { sort: 'gen', dir: 1, page: 0, size: 25 };
  return admHead('Data Anggota', `${S.data.anggota.length} anggota · ${S.data.anggota.filter(alive).length} hidup · ${Math.max.apply(null, [1].concat(Object.values(ix.gen)))} generasi`,
    `<button class="btn ghost sm" data-action="adm-csv-anggota">⬇ Ekspor CSV</button><button class="btn primary sm" data-action="add-anggota">＋ Tambah anggota</button>`) + `
  <section class="adm-card">
    <div class="adm-toolbar">${admSearch('aq', 'Cari nama, pekerjaan, alamat, nomor…')}
      <select class="input" id="a-gen" aria-label="Filter generasi"><option value="">Semua generasi</option>${Array.from({ length: maxG }, (_, i) => i + 1).map(g => `<option value="${g}" ${String(g) === S.adm.agen ? 'selected' : ''}>Gen ${g} · ${esc(genLabel(g))}</option>`).join('')}</select>
      <select class="input" id="a-stat" aria-label="Filter status">${[['', 'Semua status'], ['hidup', 'Hidup'], ['wafat', 'Almarhum'], ['L', 'Laki-laki'], ['P', 'Perempuan'], ['iuran', 'Wajib iuran'], ['lengkapi', 'Data perlu dilengkapi']].map(o => `<option value="${o[0]}" ${o[0] === sf ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>
      <span class="grow"></span><span class="muted" style="font-size:12px">${rows.length} ditampilkan</span></div>
    ${dataTable('t-anggota', cols, rows)}
  </section>`;
};
VIEWS['adm-anggota'].after = () => { bindAdmSearch('aq', 't-anggota'); bindSelect('a-gen', v => { S.adm.agen = v; S.adm.tables['t-anggota'].page = 0; }); bindSelect('a-stat', v => { S.adm.astat = v; S.adm.tables['t-anggota'].page = 0; }); bindTableUi(); };

/* ===================== TRANSAKSI KAS (tabel) ===================== */
S.adm.kbulan = ''; S.adm.kjenis = ''; S.adm.kkat = '';
function admKasRows() {
  const q = (S.adm.q['kq'] || '').toLowerCase();
  return S.data.kas.filter(k => (!S.adm.kbulan || ym(k.tanggal) === S.adm.kbulan) && (!S.adm.kjenis || k.jenis === S.adm.kjenis) && (!S.adm.kkat || k.kategori === S.adm.kkat)
    && (!q || [k.keterangan, k.kategori, nameOf(k.anggota_id), k.metode, String(k.jumlah)].join(' ').toLowerCase().includes(q)));
}
VIEWS['adm-kas'] = function () {
  const months = Array.from(new Set(S.data.kas.map(k => ym(k.tanggal)))).sort().reverse();
  const rows = admKasRows();
  const tin = rows.filter(k => k.jenis === 'Masuk').reduce((t, k) => t + k.jumlah, 0), tout = rows.filter(k => k.jenis === 'Keluar').reduce((t, k) => t + k.jumlah, 0);
  const cols = [
    { k: 'tanggal', label: 'Tanggal', r: k => `<span style="white-space:nowrap">${fmtDate(k.tanggal)}</span>` },
    { k: 'jenis', label: 'Jenis', r: k => `<span class="chip ${k.jenis === 'Masuk' ? 'green' : 'red'}">${esc(k.jenis)}</span>` },
    { k: 'kategori', label: 'Kategori' },
    { k: 'anggota', label: 'Anggota', v: k => nameOf(k.anggota_id), r: k => k.anggota_id ? nameLink(k.anggota_id) : '<span class="muted">–</span>' },
    { k: 'keterangan', label: 'Keterangan', cls: 'clip', r: k => esc(k.keterangan || '') || '<span class="muted">–</span>' },
    { k: 'metode', label: 'Metode' },
    { k: 'periode', label: 'Periode', r: k => k.periode ? esc(fmtMonth(k.periode)) : '<span class="muted">–</span>' },
    { k: 'jumlah', label: 'Jumlah (Rp)', num: true, v: k => k.jenis === 'Masuk' ? k.jumlah : -k.jumlah, r: k => `<b class="${k.jenis === 'Masuk' ? 'in' : 'out'}">${k.jenis === 'Masuk' ? '+' : '−'}${esc(nf.format(k.jumlah))}</b>` },
    { label: '', r: k => `<div class="row-actions">${k.bukti_url ? `<a class="mini" style="display:inline-grid;place-items:center;text-decoration:none" href="${esc(k.bukti_url)}" target="_blank" rel="noopener">Bukti</a>` : ''}<button class="mini" data-action="edit-kas" data-id="${esc(k.id)}">Edit</button><button class="mini red" data-action="del-kas" data-id="${esc(k.id)}">Hapus</button></div>` }
  ];
  if (!S.adm.tables['t-kas']) S.adm.tables['t-kas'] = { sort: 'tanggal', dir: -1, page: 0, size: 25 };
  const foot = `<tfoot><tr><td colspan="7" style="font-weight:800;padding:12px">Total (${rows.length} transaksi)</td><td class="num" style="font-weight:800;padding:12px"><span class="in">+${esc(nf.format(tin))}</span><br><span class="out">−${esc(nf.format(tout))}</span></td><td></td></tr></tfoot>`;
  return admHead('Transaksi Kas', `Saldo saat ini <b style="color:var(--text)">${esc(rp(saldoUntil()))}</b>`,
    `<button class="btn ghost sm" data-action="adm-csv-kas">⬇ Ekspor CSV</button><button class="btn ghost sm" data-action="catat-iuran">✓ Catat iuran</button><button class="btn primary sm" data-action="add-kas">＋ Transaksi</button>`) + `
  <div class="adm-strip">
    <div class="akpi">${ICON.kas}<div><small>Pemasukan (filter)</small><b class="in">${esc(rp(tin))}</b></div></div>
    <div class="akpi">${ICON.laporan}<div><small>Pengeluaran (filter)</small><b class="out">${esc(rp(tout))}</b></div></div>
    <div class="akpi dark">${ICON.chart}<div><small>Selisih (filter)</small><b>${esc(rp(tin - tout))}</b></div></div>
  </div>
  <section class="adm-card">
    <div class="adm-toolbar">${admSearch('kq', 'Cari keterangan, anggota, nominal…')}
      <select class="input" id="k-bulan" aria-label="Bulan"><option value="">Semua bulan</option>${months.map(m => `<option value="${m}" ${m === S.adm.kbulan ? 'selected' : ''}>${fmtMonth(m)}</option>`).join('')}</select>
      <select class="input" id="k-jenis" aria-label="Jenis"><option value="">Masuk & keluar</option><option ${S.adm.kjenis === 'Masuk' ? 'selected' : ''}>Masuk</option><option ${S.adm.kjenis === 'Keluar' ? 'selected' : ''}>Keluar</option></select>
      <select class="input" id="k-kat" aria-label="Kategori"><option value="">Semua kategori</option>${Array.from(new Set(S.data.kategori.map(k => k.nama))).map(n => `<option ${n === S.adm.kkat ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>
    </div>
    ${dataTable('t-kas', cols, rows, { foot })}
  </section>`;
};
VIEWS['adm-kas'].after = () => {
  bindAdmSearch('kq', 't-kas'); const rs = () => { S.adm.tables['t-kas'].page = 0; };
  bindSelect('k-bulan', v => { S.adm.kbulan = v; rs(); }); bindSelect('k-jenis', v => { S.adm.kjenis = v; rs(); }); bindSelect('k-kat', v => { S.adm.kkat = v; rs(); }); bindTableUi();
};

/* ===================== KABAR & MODERASI (tabel) ===================== */
S.adm.bstat = 'Menunggu';
VIEWS['berita-feed'] = VIEWS.berita;
VIEWS['adm-berita'] = function () {
  if (!S.data.berita.some(b => b.status === S.adm.bstat) && S.adm.bstat === 'Menunggu' && !S.adm.bTouched) S.adm.bstat = 'Terbit';
  const q = (S.adm.q['bq'] || '').toLowerCase();
  const rows = S.data.berita.filter(b => (!S.adm.bstat || b.status === S.adm.bstat) && (!q || [b.judul, b.isi, b.kategori, nameOf(b.penulis_id)].join(' ').toLowerCase().includes(q)));
  const cnt = s => S.data.berita.filter(b => b.status === s).length;
  const sel = S.adm.sel; Array.from(sel).forEach(id => { if (!rows.some(b => b.id === id)) sel.delete(id); });
  const cols = [
    { label: `<input type="checkbox" data-selall aria-label="Pilih semua" ${rows.length && rows.every(b => sel.has(b.id)) ? 'checked' : ''}>`, r: b => `<input type="checkbox" data-sel="${esc(b.id)}" aria-label="Pilih" ${sel.has(b.id) ? 'checked' : ''}>` },
    { k: 'judul', label: 'Berita', r: b => `<button class="link" style="text-decoration:none;font-weight:700;font-size:13.5px;text-align:left" data-action="berita-detail" data-id="${esc(b.id)}">${b.disematkan ? '📌 ' : ''}${esc(b.judul)}</button><div class="muted clip" style="max-width:360px">${esc(b.isi)}</div>` },
    { k: 'kategori', label: 'Kategori', r: b => `<span class="news-cat" style="--nc:${bMeta(b.kategori)[1]}">${bMeta(b.kategori)[0]} ${esc(b.kategori)}</span>` },
    { k: 'penulis', label: 'Penulis', v: b => nameOf(b.penulis_id), r: b => nameLink(b.penulis_id) + (b.created_by === 'admin' ? ' <span class="muted">(admin)</span>' : '') },
    { k: 'created_at', label: 'Dikirim', r: b => `<span title="${esc(b.created_at)}">${esc(timeAgo(b.created_at))}</span>` },
    { k: 'status', label: 'Status', r: b => `<span class="chip ${b.status === 'Terbit' ? 'green' : b.status === 'Menunggu' ? 'amber' : 'red'}">${esc(b.status)}</span>` },
    { k: 'reaksi', label: 'Tanggapan', num: true, v: b => b.reaksi || 0, r: b => `${b.reaksi || 0} · 💬 ${komentarOf(b.id).length}` },
    { label: '', r: b => `<div class="row-actions">${b.status !== 'Terbit' ? `<button class="mini green" data-action="berita-mod" data-v="terbit" data-id="${esc(b.id)}">Terbitkan</button>` : `<button class="mini" data-action="berita-mod" data-v="${b.disematkan ? 'lepas' : 'sematkan'}" data-id="${esc(b.id)}">${b.disematkan ? 'Lepas 📌' : 'Sematkan'}</button>`}${b.status === 'Menunggu' ? `<button class="mini red" data-action="berita-mod" data-v="tolak" data-id="${esc(b.id)}">Tolak</button>` : ''}<button class="mini" data-action="edit-berita" data-id="${esc(b.id)}">Edit</button><button class="mini red" data-action="del-berita" data-id="${esc(b.id)}">Hapus</button></div>` }
  ];
  if (!S.adm.tables['t-berita']) S.adm.tables['t-berita'] = { sort: 'created_at', dir: -1, page: 0, size: 25 };
  const moderasi = String(S.data.settings.moderasi_berita || 'Ya') !== 'Tidak';
  return admHead('Kabar & Moderasi', `Moderasi berita anggota: <b style="color:var(--text)">${moderasi ? 'aktif' : 'nonaktif'}</b> (ubah di Pengaturan)`,
    `<button class="btn ghost sm" data-action="adm-nav" data-k="berita-feed">👁 Lihat sebagai feed</button><button class="btn primary sm" data-action="add-berita">✎ Tulis kabar</button>`) + `
  <section class="adm-card">
    <div class="adm-toolbar"><div class="seg" style="min-width:380px">${[['Menunggu', 'Menunggu'], ['Terbit', 'Terbit'], ['Ditolak', 'Ditolak'], ['', 'Semua']].map(([v, l]) => `<button class="${S.adm.bstat === v ? 'active' : ''}" data-action="adm-bstat" data-v="${v}">${l}${v ? ` (${cnt(v)})` : ''}</button>`).join('')}</div>
      ${admSearch('bq', 'Cari judul, isi, penulis…')}</div>
    ${sel.size ? `<div class="bulkbar">${sel.size} berita dipilih<span class="sp"></span><button class="mini green" data-action="adm-bulk" data-v="terbit">Terbitkan semua</button><button class="mini red" data-action="adm-bulk" data-v="tolak">Tolak semua</button><button class="mini" data-action="adm-bulk-clear">Batal</button></div>` : ''}
    ${dataTable('t-berita', cols, rows)}
  </section>`;
};
VIEWS['adm-berita'].after = () => {
  bindAdmSearch('bq', 't-berita'); bindTableUi();
  $$('[data-sel]').forEach(c => c.onchange = () => { c.checked ? S.adm.sel.add(c.dataset.sel) : S.adm.sel.delete(c.dataset.sel); render(); });
  const all = $('[data-selall]'); if (all) all.onchange = () => { $$('[data-sel]').forEach(c => all.checked ? S.adm.sel.add(c.dataset.sel) : S.adm.sel.delete(c.dataset.sel)); render(); };
};

/* ===================== LOG AKTIVITAS ===================== */
S.adm.lent = '';
VIEWS['adm-log'] = function () {
  const logs = S.adm.log;
  if (logs === null) return admHead('Log Aktivitas', 'Memuat…') + '<div class="adm-card"><div class="skeleton" style="height:300px"></div></div>';
  const q = (S.adm.q['lq'] || '').toLowerCase();
  const ents = Array.from(new Set(logs.map(l => l.entitas).filter(Boolean))).sort();
  const rows = logs.filter(l => (!S.adm.lent || l.entitas === S.adm.lent) && (!q || [l.aksi, l.entitas, l.entitas_id, l.ringkasan, l.peran].join(' ').toLowerCase().includes(q)));
  const cols = [
    { k: 'waktu', label: 'Waktu', r: l => `<span style="white-space:nowrap">${esc(String(l.waktu).replace('T', ' '))}</span> <span class="muted">${esc(timeAgo(l.waktu))}</span>` },
    { k: 'peran', label: 'Peran', r: l => `<span class="chip ${l.peran === 'admin' ? '' : 'gray'}">${esc(l.peran)}</span>` },
    { k: 'aksi', label: 'Aksi', r: l => `<span class="chip ${logChip(l.aksi)}">${esc(l.aksi)}</span>` },
    { k: 'entitas', label: 'Data' },
    { k: 'ringkasan', label: 'Keterangan', cls: 'clip' },
    { k: 'entitas_id', label: 'ID', r: l => `<span class="muted">${esc(l.entitas_id)}</span>` }
  ];
  if (!S.adm.tables['t-log']) S.adm.tables['t-log'] = { sort: 'waktu', dir: -1, page: 0, size: 50 };
  return admHead('Log Aktivitas', `${logs.length} aktivitas terakhir dari sheet Log. Berguna untuk menelusuri siapa mengubah apa.`,
    `<button class="btn ghost sm" data-action="adm-log-reload">⟳ Muat ulang</button>`) + `
  <section class="adm-card"><div class="adm-toolbar">${admSearch('lq', 'Cari aksi, data, keterangan…')}
    <select class="input" id="l-ent" aria-label="Jenis data"><option value="">Semua data</option>${ents.map(e => `<option ${e === S.adm.lent ? 'selected' : ''}>${esc(e)}</option>`).join('')}</select></div>
    ${dataTable('t-log', cols, rows)}</section>`;
};
VIEWS['adm-log'].after = () => { if (S.adm.log === null) loadLog(); bindAdmSearch('lq', 't-log'); bindSelect('l-ent', v => { S.adm.lent = v; S.adm.tables['t-log'].page = 0; }); bindTableUi(); };

/* ---------- ekspor ---------- */
function admCsvAnggota() {
  const ix = index();
  const rows = [['ID', 'Nama', 'Panggilan', 'JK', 'Generasi', 'Label generasi', 'Tempat lahir', 'Tgl lahir', 'Tgl wafat', 'Ayah', 'Ibu', 'Pasangan', 'No HP', 'Email', 'Alamat', 'Pekerjaan', 'Wajib iuran']];
  S.data.anggota.slice().sort((a, b) => ix.gen[a.id] - ix.gen[b.id] || a.nama.localeCompare(b.nama)).forEach(a => rows.push([a.id, a.nama, a.panggilan, a.jenis_kelamin, ix.gen[a.id], genLabel(ix.gen[a.id]), a.tempat_lahir, a.tgl_lahir, a.tgl_wafat,
    nameOf(a.ayah_id), nameOf(a.ibu_id), spouseIds(a).map(nameOf).join('; '), a.no_hp, a.email, a.alamat, a.pekerjaan, wajib(a) ? 'Ya' : 'Tidak']));
  downloadCsv(`anggota-${todayStr()}.csv`, rows);
}
function admCsvKas() {
  const rows = [['Tanggal', 'Jenis', 'Kategori', 'Anggota', 'Keterangan', 'Metode', 'Periode', 'Jumlah']];
  admKasRows().sort((a, b) => a.tanggal.localeCompare(b.tanggal)).forEach(k => rows.push([k.tanggal, k.jenis, k.kategori, nameOf(k.anggota_id), k.keterangan, k.metode, k.periode, k.jenis === 'Masuk' ? k.jumlah : -k.jumlah]));
  downloadCsv(`kas-${S.adm.kbulan || 'semua'}-${todayStr()}.csv`, rows);
}

/* ---------- aksi khusus panel ---------- */
Object.assign(ACT, {
  'adm-nav': el => {
    const k = el.dataset.k;
    if (k === '@iuran') { S.lap.tab = 'iuran'; go('laporan'); return; }
    if (k === 'laporan' && S.lap.tab === 'iuran') S.lap.tab = 'arus';
    if (k === 'adm-log' && S.adm.log === null) loadLog();
    go(k);
  },
  'adm-side-open': () => document.body.classList.add('side-open'),
  'adm-side-close': () => document.body.classList.remove('side-open'),
  'adm-gen': el => { S.adm.agen = el.dataset.g; S.adm.astat = ''; if (S.adm.tables['t-anggota']) S.adm.tables['t-anggota'].page = 0; go('adm-anggota'); },
  'dt-sort': el => { const t = S.adm.tables[el.dataset.t]; if (!t) return; if (t.sort === el.dataset.k) t.dir = -t.dir; else { t.sort = el.dataset.k; t.dir = 1; } t.page = 0; render(); },
  'dt-page': el => { const t = S.adm.tables[el.dataset.t]; if (!t) return; t.page = Math.max(0, t.page + Number(el.dataset.d)); render(); window.scrollTo(0, 0); },
  'adm-bstat': el => { S.adm.bstat = el.dataset.v; S.adm.bTouched = true; S.adm.sel.clear(); if (S.adm.tables['t-berita']) S.adm.tables['t-berita'].page = 0; render(); },
  'adm-bulk-clear': () => { S.adm.sel.clear(); render(); },
  'adm-bulk': async el => {
    const ids = Array.from(S.adm.sel), v = el.dataset.v; if (!ids.length) return;
    if (v === 'tolak' && !(await confirmSheet('Tolak ' + ids.length + ' berita?', 'Berita yang ditolak tidak tampil untuk keluarga. Bisa diterbitkan kembali kapan saja dari tab Ditolak.', 'Tolak'))) return;
    let ok = 0;
    for (const id of ids) {
      toast(`Memproses ${ok + 1} dari ${ids.length}…`);
      try { const r = await api('apiModerasiBerita', S.token, id, v); upsert('berita', r); ok++; } catch (e) { toast(e.message, 'error'); handleAuthErr(e); break; }
    }
    S.adm.sel.clear(); toast(`${ok} berita ${v === 'terbit' ? 'diterbitkan' : 'ditolak'}`, 'ok'); render();
  },
  'adm-csv-anggota': admCsvAnggota,
  'adm-csv-kas': admCsvKas,
  'adm-log-reload': () => { S.adm.log = null; render(); loadLog(); }
});

// Setelah data berubah (simpan/hapus), log aktivitas perlu dimuat ulang saat dibuka berikutnya.
const _admUpsert = upsert;
upsert = function (list, rec) { _admUpsert(list, rec); S.adm.log = null; };

/* ---------- mulai ---------- */
S.token = store.get('af_token');
reload();
</script>
