  <script>
  // Penjaga awal: menampilkan penyebab bila aplikasi gagal dimuat, alih-alih tertahan di layar "Memuat".
  (function () {
    function show(title, detail) {
      var b = document.querySelector('.boot');
      if (!b) { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { show(title, detail); }); return; }
      b.innerHTML = '<div class="boot-logo">!</div><p style="max-width:440px;padding:0 20px;line-height:1.5"><b>' + title + '</b><br>' + detail +
        '</p><button onclick="location.reload()" style="border:0;border-radius:14px;padding:12px 20px;font-weight:700;background:#2f6fed;color:#fff">Muat ulang</button>';
    }
    function escH(x) { return String(x).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
    function codeBox(lines) {
      return '<code style="display:block;text-align:left;font-size:11px;background:#fff;border-radius:8px;padding:8px;margin:8px 0;word-break:break-all;white-space:pre-wrap">' + lines + '</code>';
    }
    function visible(line) {
      // tampilkan karakter tak biasa sebagai kode heksadesimal agar perubahan tersembunyi terlihat
      return escH(line.slice(0, 160)).replace(/[^\x20-\x7E]/g, function (c) { return '<b style="color:#b91c1c">[U+' + c.charCodeAt(0).toString(16).toUpperCase() + ']</b>'; });
    }
    window.addEventListener('error', function (e) {
      var t = e.target;
      if (t && t !== window && t.getAttribute) {
        var a = t.getAttribute('data-af-asset');
        if (a) show('File tampilan tidak bisa dimuat', '<code>' + escH(a) + '</code> gagal diambil dari GitHub.<br><small>Pastikan file sudah diunggah ke repo dan GitHub Pages aktif, lalu jalankan Cek instalasi di spreadsheet.</small>');
        return;
      }
      var where = e.filename && e.filename.split('#')[0] !== location.href.split('#')[0] ? e.filename.split('/').pop().split('?')[0] : 'halaman';
      var head = (e.message || 'tidak diketahui') + ' (' + where + (e.lineno ? ', baris ' + e.lineno : '') + (e.colno ? ', kolom ' + e.colno : '') + ')';
      var tip = '<small>Jalankan <b>Asrori Fam\'s &gt; 5. Cek instalasi</b> di spreadsheet dan kirim hasilnya bersama layar ini.</small>';
      if (where !== 'halaman' && e.lineno) {
        show('Terjadi kesalahan JavaScript', escH(head) + '<br><small>Mengambil baris kode…</small>');
        fetch(e.filename).then(function (r) { return r.text(); }).then(function (txt) {
          var L = txt.split('\n'), n = e.lineno - 1;
          show('Terjadi kesalahan JavaScript', escH(head) + codeBox([n - 1, n].filter(function (i) { return L[i] != null; }).map(function (i) { return (i + 1) + ': ' + visible(L[i]); }).join('<br>')) + tip);
        }).catch(function () { show('Terjadi kesalahan JavaScript', escH(head) + '<br>' + tip); });
        return;
      }
      var code = '';
      try {
        var L2 = document.documentElement.outerHTML.split('\n'), m = (e.lineno || 0) - 2;
        code = [L2[m - 1], L2[m]].filter(Boolean).map(visible).join('<br>');
      } catch (x) {}
      show('Terjadi kesalahan JavaScript', escH(head) + (code ? codeBox(code) : '') +
        '<small>Tampilan masih dimuat dari file HTML di proyek Apps Script. Aktifkan sumber GitHub: <b>Asrori Fam\'s &gt; 6. Atur sumber tampilan (GitHub)</b>, lalu buat Versi baru.</small>');
    }, true);
    setTimeout(function () {
      if (!document.querySelector('.boot')) return;
      if (!window.AF_SCRIPTS_LOADED) show('File Scripts tidak termuat', 'Pastikan file HTML bernama persis <code>Scripts</code> berisi kode lengkap (baris terakhir <code>&lt;/script&gt;</code>), simpan, lalu buat Versi baru di Kelola deployment.');
      else show('Server belum merespons', 'Kemungkinan: (1) browser login ke beberapa akun Google, coba jendela Samaran; (2) izin belum diberikan, jalankan menu Setup di spreadsheet; (3) koneksi lambat. Detail: buka menu <b>Asrori Fam\'s &gt; 5. Cek instalasi</b> di spreadsheet.');
    }, 20000);
  })();
  </script>
